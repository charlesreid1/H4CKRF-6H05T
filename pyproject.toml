[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hackrf-agent"
version = "0.1.0"
description = "AI control plane for HackRF One — safe, auditable SDR operations via LLM tool-use"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [
    {name = "Charles Reid"}
]
keywords = ["hackrf", "sdr", "ai", "llm", "tool-use", "rf"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Communications :: Ham Radio",
    "Topic :: Scientific/Engineering",
]

dependencies = [
    "numpy>=1.26",
    "typer>=0.12",
    "rich>=13.7",
    "aiosqlite>=0.20",
]

[project.optional-dependencies]
openrouter = [
    "openai>=1.40",
]
hackrf = [
    "python-hackrf>=1.5",
]
mcp = [
    "mcp==2.0.0",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
    "mypy>=1.9",
    "hackrf-agent[openrouter]",
    "hackrf-agent[hackrf]",
    "hackrf-agent[mcp]",
]

[project.scripts]
hackrf-agent = "hackrf_agent.cli.main:app"
hackrf-agent-mcp = "hackrf_agent.mcp.__main__:main"

[project.urls]
Homepage = "https://github.com/charlesreid/hackrf-agent"
Repository = "https://github.com/charlesreid/hackrf-agent"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"hackrf_agent.data" = ["*.sql"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM", "RUF"]
# Silence categories that fight the codebase style without buying safety:
#   E501: line-too-long — MCP tool descriptions and Pydantic Field
#         descriptions are inherently long strings; wrapping them harms
#         grep-ability. We keep line-length=100 as an aspiration for
#         normal code but don't gate on it.
#   B017: assert-raises-exception — pytest.raises(Exception) is used in
#         a few places where the arg-model rejection type is intentional.
#   RUF001/003: em-dash + smart quotes are intentional in prose docstrings.
#   RUF015: `list(x)[0]` reads clearer than `next(iter(x))` at callsites.
#   RUF046: `int(...)` on numpy scalars documents the JSON-primitive
#           promise; keep the cast as intent.
#   RUF059: `for _, x in items` is idiomatic.
ignore = ["E501", "B017", "RUF001", "RUF003", "RUF015", "RUF046", "RUF059"]

[tool.ruff.lint.per-file-ignores]
# Kept intentionally: these predate the RUF ratchet and are stylistic
# rather than correctness-related. Left in place so the ratchet catches
# net-new regressions; not worth churn to fix retroactively.
"src/hackrf_agent/hw/analysis.py" = ["F841", "SIM102", "SIM108"]
"src/hackrf_agent/hw/hackrf_driver.py" = ["SIM105"]
"src/hackrf_agent/domain/executor.py" = ["SIM102"]
"src/hackrf_agent/ai/llm_client.py" = ["SIM102"]
"src/hackrf_agent/cli/mcp_cmd.py" = ["B904"]
"tests/mcp/test_server_smoke.py" = ["SIM105"]
"tests/mcp/test_approval_flow.py" = ["SIM105"]
"tests/unit/test_analysis.py" = ["F841"]
"tests/unit/test_audit_service.py" = ["B007"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "hardware: tests that require a HackRF One attached via USB",
    "llm: tests that require a live LLM API key (OpenRouter)",
    "slow: tests that take more than 5 seconds",
]
