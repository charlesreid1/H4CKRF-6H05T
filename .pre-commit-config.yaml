repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.4.10
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.9.0
    hooks:
      - id: mypy
        additional_dependencies:
          - pydantic>=2.0
          - numpy>=1.26

  - repo: local
    hooks:
      - id: regenerate-schema
        name: regenerate execute_command schema
        entry: python scripts/generate_execute_command_schema.py
        language: system
        files: >
          ^(src/hackrf_agent/domain/models\.py|
            src/hackrf_agent/ai/prompts\.py|
            scripts/generate_execute_command_schema\.py)$
        pass_filenames: false

      - id: schema-no-drift
        name: schema files match regenerator output
        entry: bash -c 'git diff --exit-code docs/execute_command_schema.md schemas/execute_command.schema.json'
        language: system
        pass_filenames: false
        stages: [push]

      - id: validate-knowledge-records
        name: knowledge/records/*.json validate against schemas/knowledge/
        entry: python scripts/validate_knowledge_records.py
        language: system
        files: >
          ^(knowledge/records/.*\.json|
            schemas/knowledge/.*\.json|
            scripts/validate_knowledge_records\.py)$
        pass_filenames: false
